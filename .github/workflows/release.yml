name: Build and release Steam Frame binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build native dependencies and binary
        run: sh scripts/build.sh native

      - name: Run protocol and image regression tests
        run: |
          sh tests/run.sh
          SANITIZE=1 sh tests/run.sh

      - name: Test MJPEG and cleanup with simulated USB
        run: sh tests/integration.sh

      - name: Build the static ARM64 binary and package
        run: |
          sh scripts/build.sh steam-frame
          sh scripts/package-steam-frame.sh
          file dist/vft-stream-steam-frame
          readelf -h dist/vft-stream-steam-frame | grep -q 'Machine:.*AArch64'
          if readelf -l dist/vft-stream-steam-frame | grep -q INTERP; then
            echo 'ARM64 binary unexpectedly requires a runtime interpreter.' >&2
            exit 1
          fi
          (cd dist; sha256sum vft-stream-steam-frame vft-stream-focus3-steam-frame.tar.gz > SHA256SUMS)

      - name: Publish the hardware-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/vft-stream-steam-frame \
            dist/vft-stream-focus3-steam-frame.tar.gz \
            dist/SHA256SUMS \
            --verify-tag --prerelease \
            --title "Focus 3 on Steam Frame ($RELEASE_TAG)" \
            --notes-file .github/release-notes.md
